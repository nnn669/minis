name: Restore pre-log baseline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-pre-log-baseline
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace main tree with baseline
        shell: bash
        env:
          BASELINE_SHA: 33777866578a68d3815e362c9cd45cfe6c651170
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$BASELINE_SHA"
          git rm -r --ignore-unmatch .
          git checkout "$BASELINE_SHA" -- .
          baseline_tree="$(git rev-parse "${BASELINE_SHA}^{tree}")"
          restored_tree="$(git write-tree)"
          test "$restored_tree" = "$baseline_tree"
          git commit -m "revert: restore repository to pre-log baseline"
          git push origin HEAD:main