name: Apply and validate OkHttp Happy Eyeballs upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: false

      - name: Apply exact dependency and toolchain updates
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrences of {old!r}, found {actual}"
                  )
              file.write_text(text.replace(old, new))

          replace_exact(
              "src/android/app/build.gradle.kts",
              'com.squareup.okhttp3:okhttp:4.12.0',
              'com.squareup.okhttp3:okhttp:5.4.0',
              1,
          )
          replace_exact(
              "src/android/app/build.gradle.kts",
              'com.squareup.okhttp3:okhttp-sse:4.12.0',
              'com.squareup.okhttp3:okhttp-sse:5.4.0',
              1,
          )
          replace_exact(
              "src/android/app/build.gradle.kts",
              'com.squareup.okhttp3:mockwebserver:4.12.0',
              'com.squareup.okhttp3:mockwebserver:5.4.0',
              1,
          )
          replace_exact(
              "src/android/build.gradle.kts",
              'id("com.android.application") version "8.7.3"',
              'id("com.android.application") version "8.10.1"',
              1,
          )
          replace_exact(
              "src/android/build.gradle.kts",
              'version "2.1.0" apply false',
              'version "2.2.21" apply false',
              3,
          )
          replace_exact(
              "src/android/build.gradle.kts",
              'id("com.google.devtools.ksp") version "2.1.0-1.0.29"',
              'id("com.google.devtools.ksp") version "2.2.21-2.0.5"',
              1,
          )

          Path(".github/workflows/apply-okhttp-happy-eyeballs.yml").unlink()

      - name: Commit final source-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/app/build.gradle.kts src/android/build.gradle.kts \
            .github/workflows/apply-okhttp-happy-eyeballs.yml
          git commit -m "fix(android): enable OkHttp Happy Eyeballs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android JVM unit tests
        working-directory: src/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
