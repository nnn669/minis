name: Validate & publish v0.23-preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;34.0.0
            build-tools;36.0.0
            ndk;27.0.12077973
            ndk;28.0.12433566
            cmake;3.22.1

      # The public mirror ships an EMPTY ANTHROPIC_OAUTH_IDENTIFIER_PROMPT
      # (provider-customization.properties.example), but
      # AnthropicProvider.resolveSystemPrompt reads that value unconditionally
      # and ClaudeOAuthManager throws IllegalStateException when it is blank —
      # so AnthropicProviderTest can never go green on the public mirror
      # without a value. Inject a non-empty TEST-ONLY value so the unit-test
      # gate passes; the APK itself is packaged from the blank example below,
      # keeping it identical to the upstream public build.
      - name: Prepare customization properties (test value)
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties
          printf 'ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=You are Claude Code, Anthropic\x27s official CLI for Claude.\n' \
            >> src/android/app/provider-customization.properties
          grep -q 'ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=You are Claude Code' \
            src/android/app/provider-customization.properties

      # 1) Validation gate: JVM unit tests (compiles main sources incl.
      #    okhttp 5.4.0 path; runs Ipv4PreferredDnsTest etc.)
      - name: Run unit tests
        run: |
          cd src/android
          ./gradlew -Dorg.gradle.jvmargs=-Xmx4g :app:testDebugUnitTest --stacktrace

      # Restore the blank public-mirror value so the packaged APK carries no
      # injected test placeholder.
      - name: Reset customization properties for packaging
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      # 2) Native deps required for a complete APK (PRoot + Alpine rootfs)
      # [fix-sandbox] Pin NDK r28 (16KB-page capable, matches upstream's
      # working build) and VERIFY it: $VAR in a workflow env: block is NOT
      # expanded by GitHub Actions (only ${{ }} is), so the previous run
      # silently fell back to the runner's preinstalled r27d. Now we export
      # inside the run block (where $ANDROID_HOME expands) and fail loudly
      # if the r28 dir is missing or the built binary is not 16KB-aligned.
      - name: Build native deps (PRoot + rootfs)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.0.12433566"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "ERROR: NDK r28 dir missing: $ANDROID_NDK_HOME"
            echo "Installed NDKs:"; ls "${ANDROID_HOME}/ndk/" || true
            exit 1
          fi
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          echo "--- verify proot 16KB alignment (LOAD align 0x4000) ---"
          readelf -l src/android/app/src/main/assets/proot-aarch64 | grep -A1 "^  LOAD" | tee /tmp/proot-phdr.txt
          ALIGN_OK=$(grep -c "0x4000" /tmp/proot-phdr.txt || true)
          if [ "$ALIGN_OK" -lt 3 ]; then
            echo "ERROR: proot LOAD segments are not 16KB-aligned (expect 0x4000)"
            exit 1
          fi
          strings src/android/app/src/main/assets/proot-aarch64 | grep -oE "r2[0-9]+(-[a-z0-9]+)?" | sort -u | head -3
          echo "--- assets ---"
          ls -lh src/android/app/src/main/assets/ | grep -E "proot|alpine" || true

      # 3) Assemble the release APK
      # [fix-sandbox] Release build (debuggable=false) — the debug APK's
      # runtime differs (malloc debug / ptrace env) and the sandbox fails to
      # start on Android 15 devices. Release uses the debug signing config
      # (build.gradle.kts), so no keystore is needed.
      - name: Assemble release APK
        run: |
          cd src/android
          ./gradlew -Dorg.gradle.jvmargs=-Xmx4g :app:assembleRelease --stacktrace

      - name: Publish test release v0.23-preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # [fix-sandbox] prefer the release APK (debug APK breaks the sandbox)
          APK=$(find src/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          cat > /tmp/release-notes.md <<'EOF'
          ## v0.23-preview（2026-08-13）测试版 — 沙盒诊断修复版

          ### 本次覆盖发布：沙盒 / Shell 无法启动（诊断 + 修复）
          - 0.23 首版只验证了"release 构建"假设，未解决用户设备上的问题；本版补齐启动诊断并移除两个最可疑的静默杀手：
            1. **proot 启动错误不再被吞**：此前 readLoop 只在命令回调挂起时消费输出，proot 在 200ms 启动窗口内的报错（stderr 合并进 stdout）被静默丢弃，现象只有光秃秃的 "process exited"。现在无回调时的输出也打进日志（`[shell]` 标签），proot 的真实错误（ptrace/rootfs/native-offload/argv）可直接定位。
            2. **proot 改从 assets/proot-aarch64 复制到 filesDir 执行**：不再依赖 nativeLibraryDir/libproot.so——该副本经 AGP 打包 + 系统 installd 提取，静态链接 PIE 伪装 .so 可能在这两个环节被破坏。
            3. **启动前校验 rootfs /bin/sh**：rootfs 解压损坏时显式报错并提示重装，不再让 proot 哑火。
          - 版本号沿用 0.23-preview（versionCode 23），已装 0.22 及更早版本的用户在 App 内"检查更新"即可收到。

          ### 修复：内置升级不再推送上游版本
          - 更新源固定为本仓库 nnn669/minis，不再检查上游 OpenMinis/OpenMinis 的 Release。

          提交：4d1f2bd（PersistentShell 启动诊断 + assets proot 来源）、c478e301（release 构建 + NDK r28 proot）、1097d58e（NDK r28 CI 校验）、a75fa69（更新源）、4fbe2ec（About 链接）、fa3bcb0（版本号）
          EOF
          if gh release view v0.23-preview >/dev/null 2>&1; then
            gh release upload v0.23-preview "$APK" --clobber
            gh release edit v0.23-preview --notes-file /tmp/release-notes.md
          else
            gh release create v0.23-preview "$APK" \
              --title "v0.23-preview" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minis-v0.23-preview-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error